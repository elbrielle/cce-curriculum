<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body { font-family: Arial, sans-serif; }
    .slide { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f4f7fb; }
    .slide::before { content: ""; position: absolute; inset: 0; opacity: .12; background-image: radial-gradient(#2956a3 1.2px, transparent 1.2px); background-size: 28px 28px; }
    .rail { position: absolute; left: 0; top: 0; width: 22px; height: 720px; background: #0b1f4d; }
    .wash { position: absolute; right: -170px; top: -210px; width: 610px; height: 610px; border-radius: 50%; background: #dcefe9; }
    .wash.gold { background: #fff0be; }
    .wash.purple { background: #eadff3; }
    .accent { position: absolute; left: 58px; top: 42px; width: 98px; height: 10px; border-radius: 8px; background: #f4b63d; }
    .surface { position: absolute; left: 48px; top: 86px; right: 48px; bottom: 42px; border-radius: 34px; background: rgba(255,255,255,.92); box-shadow: 0 18px 50px rgba(11,31,77,.10); border: 1px solid rgba(41,86,163,.12); }
    .media { position: absolute; right: 72px; top: 150px; width: 522px; height: 430px; border-radius: 30px; background: #e8eef6; box-shadow: 0 14px 34px rgba(11,31,77,.12); }
    .media.left { left: 72px; right: auto; }
    .bottom { position: absolute; left: 58px; bottom: 42px; width: 278px; height: 10px; border-radius: 10px; background: #0c8f8f; }
    .corner { position: absolute; right: 42px; bottom: 34px; width: 74px; height: 74px; border: 12px solid #f4b63d; border-left-color: transparent; border-radius: 50%; transform: rotate(22deg); opacity: .7; }
  </style>
</head>
<body>
  <div id="left-media" class="slide"><div class="rail"></div><div class="wash gold"></div><div class="accent"></div><div class="surface"></div><div class="media"></div><div class="bottom"></div><div class="corner"></div></div>
  <div id="right-media" class="slide"><div class="rail"></div><div class="wash"></div><div class="accent"></div><div class="surface"></div><div class="media left"></div><div class="bottom"></div><div class="corner"></div></div>
  <div id="split" class="slide"><div class="rail"></div><div class="wash purple"></div><div class="accent"></div><div class="surface"></div><div class="bottom"></div><div class="corner"></div></div>
  <div id="video" class="slide"><div class="rail"></div><div class="wash"></div><div class="accent"></div><div class="surface"></div><div class="media"></div><div class="bottom"></div><div class="corner"></div></div>
</body>
</html>
